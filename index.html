<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>The Wall</title>
    <meta
        name="description"
        content="A collaborative canvas built by everyone."
    >

    <link rel="icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- SPLASH SCREEN -->

    <div id="splash" aria-hidden="true">

        <div
            class="splash-art"
            id="splashArt"
        ></div>

        <div class="splash-title">

            <strong>The Wall</strong>

            <span>By: Corona</span>

        </div>

    </div>


    <!-- APP -->

    <div id="app">

        <header class="topbar">

            <div class="brand">

                <div class="brand-mark"></div>

                <div>

                    <h1>The Wall</h1>

                    <span>
                        built by everyone
                    </span>

                </div>

            </div>

                <span
                    id="ownerText"
                >
                    By: Corona
                </span>

            </div>

        </header>


        <main id="wallContainer">

            <canvas
                id="wallCanvas"
            ></canvas>


            <div id="loading">

                <div class="loader"></div>

                <span>
                    Entering The Wall...
                </span>

            </div>


            <div
                class="coordinates"
                id="coordinates"
            >
                X: 0 · Y: 0
            </div>


            <div class="controls">

                <button
                    id="zoomOut"
                    aria-label="Zoom out"
                >
                    −
                </button>

                <div id="zoomValue">
                    100%
                </div>

                <button
                    id="zoomIn"
                    aria-label="Zoom in"
                >
                    +
                </button>

                <button
                    id="resetView"
                    aria-label="Reset view"
                >
                    ⌂
                </button>

            </div>


            <div
                class="palette"
                id="palette"
            ></div>


            <div class="info-panel">

                <div>

                    <strong
                        id="pixelCount"
                    >
                        0
                    </strong>

                    <span>
                        pixels
                    </span>

                </div>


                <div>

                    <strong>
                        10,000
                    </strong>

                    <span>
                        × 10,000
                    </span>

                </div>

            </div>


            <div
                class="selected-pixel"
                id="selectedPixel"
            >

                <div class="selected-header">

                    <span>
                        PIXEL
                    </span>

                    <button
                        id="closePixel"
                        aria-label="Close pixel information"
                    >
                        ×
                    </button>

                </div>


                <div
                    class="pixel-preview"
                    id="pixelPreview"
                ></div>


                <div class="pixel-data">

                    <div>

                        <span>
                            X
                        </span>

                        <strong
                            id="pixelX"
                        >
                            0
                        </strong>

                    </div>


                    <div>

                        <span>
                            Y
                        </span>

                        <strong
                            id="pixelY"
                        >
                            0
                        </strong>

                    </div>


                    <div>

                        <span>
                            COLOR
                        </span>

                        <strong
                            id="pixelColor"
                        >
                            #000000
                        </strong>

                    </div>

                </div>

            </div>

        </main>


        <footer>

            <span>
                The Wall
            </span>

            <span>
                •
            </span>

            <span>
                Every pixel tells a story.
            </span>

        </footer>

    </div>


    <script src="config.js"></script>
    <script src="splash.js"></script>
    <script src="supabase.js"></script>
    <script src="wall.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>

</body>
</html>
